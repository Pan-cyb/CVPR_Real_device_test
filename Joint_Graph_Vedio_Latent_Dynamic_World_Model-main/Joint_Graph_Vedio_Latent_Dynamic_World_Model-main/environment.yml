# Portable research environment for JointGV.
#
# This records direct dependencies instead of a platform-specific
# `conda env export`, so it contains no local prefix or Windows build strings.
# The PyTorch wheels below target NVIDIA CUDA 12.8.
name: jointgv

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10
  - pip>=24
  - numpy=1.26.*
  - scipy=1.15.*
  - pyyaml>=6
  - tqdm>=4.67
  - tensorboard>=2.20
  - h5py>=3.10
  - einops>=0.8
  - matplotlib>=3.8
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0+cu128
      - torchvision==0.25.0+cu128
      - dm-control==1.0.44
      - mujoco==3.11.0
      - gymnasium==1.3.0
      - imageio==2.37.4
      - imageio-ffmpeg==0.6.0
      - huggingface-hub>=0.25
      - pillow==11.3.0
      - gdown>=5.2
      - pytest==9.1.1
      # LPIPS in evaluate_ablation.py; downloads AlexNet weights on first use.
      - lpips==0.1.4
